[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-middleware"
version = "0.1.0"
description = "FastAPI middleware для извлечения user context из заголовков"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.110",
]

[project.urls]
"Homepage" = "https://github.com/RideTrip-tour/middlewares.git"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package.find]
where = ["src"]

[tool.setuptools.package-data]
internal_middleware = ["py.typed"]